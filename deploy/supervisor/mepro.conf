; Salin ke /etc/supervisor/conf.d/ lalu sesuaikan path. Setelahnya: supervisorctl reread && supervisorctl update
[program:mepro-mqtt]
command=php /var/www/mepro/artisan mqtt:listen
directory=/var/www/mepro
user=www-data
autostart=true
autorestart=true
startretries=999
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/mepro-mqtt.log

[program:mepro-reverb]
command=php /var/www/mepro/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/mepro
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/mepro-reverb.log
